      const design = { navigation: 'filled' };
      function renderComparison() {
        const scene = picker.value;
        const name = picker.options[picker.selectedIndex].text;
        const current = root.querySelector('#pitclaw-current-image');
        const proposed = root.querySelector('#pitclaw-proposed-image');
        current.src = images['current-' + scene];
        proposed.src = images['proposed-' + design.navigation + '-' + scene];

        root.querySelector('#pitclaw-proposed-scene').textContent = name;
