# Include these locations inside your existing server { } block.
# Replace 192.168.0.29 with the controller's LAN IP.
# /newbbq is an example mount path; change it to any directory you prefer.

location = /newbbq {
    absolute_redirect off;
    return 301 /newbbq/$is_args$args;
}

location ^~ /newbbq/ {
    # The trailing slash strips /newbbq/ before forwarding to the device.
    proxy_pass http://192.168.0.29/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 8m;
}
