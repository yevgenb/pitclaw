[env:wt32_sc01_plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<*>
    -<simulator/>
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
; WT32-SC01 Plus has 2 MB QSPI PSRAM (not octal PSRAM).
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_speed = 921600

; LittleFS for web UI files and config
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    dlloydev/QuickPID@^3.1.9
    bblanchon/ArduinoJson@^7.0.0
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0
    lvgl/lvgl@^9.1.0
    lovyan03/LovyanGFX@1.2.28
    https://github.com/smartpanle/PanelLan_esp32_arduino.git#2bc0d086c9a55f5288d85da6c16968c22744fe5f
    ESP32Servo
    https://github.com/tzapu/WiFiManager.git
    ayushsharma82/ElegantOTA@^3.1.0

build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; GitHub release checks are opt-in for development. Manual /update stays available.
    ; Set to 1 to enable release checks for a stable x.y.z firmware version.
    -DENABLE_RELEASE_UPDATES=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; PanelLan BOARD_SC01_PLUS supplies the i8080 LCD and I2C1 touch pins.
    ; LVGL config
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_THEME_DEFAULT_TRANSITION_TIME=0
    -DLV_THEME_DEFAULT_GROW=0
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_36=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_USE_QRCODE=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST
    -DNATIVE_BUILD
    -Isrc
lib_deps =
    throwtheswitch/Unity@^2.6.0
test_filter = test_desktop/*

[env:simulator]
platform = native
build_flags =
    -DSIMULATOR_BUILD
    -DLV_CONF_SKIP=1
    -DLV_THEME_DEFAULT_TRANSITION_TIME=0
    -DLV_THEME_DEFAULT_GROW=0
    -DLV_COLOR_DEPTH=32
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_36=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_USE_QRCODE=1
    -DLV_USE_SDL=1
    -DLV_MEM_SIZE=262144
    -Isrc
    -DMG_ENABLE_PACKED_FS=0
lib_deps =
    lvgl/lvgl@^9.1.0
    bblanchon/ArduinoJson@^7.0.0
build_src_filter =
    -<*>
    +<simulator/>
    +<display/>
    +<web_protocol.cpp>
extra_scripts = sdl2_setup.py
