name: Prototype release

# Releases are deliberate snapshots. Ordinary pushes run CI only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New prototype tag (for example prototype-2026-11-14)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Check, build and publish prototype
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio intelhex
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-release-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-release-
      - name: Build firmware with its source version
        working-directory: firmware
        run: pio run -e wt32_sc01_plus
      - name: Run desktop and integration checks
        working-directory: firmware
        run: |
          pio test -e native
          python test/lid/run_checks.py
          python test/auth/run_checks.py
          for test in test/web/*.cjs; do node "$test"; done
      - name: Verify enclosure package and collect assets
        run: python scripts/package_prototype.py "$RUNNER_TEMP/pitclaw-release"
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pit Claw prototype — ${{ inputs.tag }}
          body_path: docs/build-story.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/pitclaw-release/*
